services:
  hardhat:
    build:
      context: ./contracts
      dockerfile: Dockerfile
    container_name: rental-hardhat
    restart: unless-stopped
    ports:
      - "8545:8545"
    volumes:
      - ./contracts:/app
      - /app/node_modules
    command: ["npx", "hardhat", "node", "--hostname", "0.0.0.0"]
    networks:
      - rental-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8545" ]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rental-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_RPC_URL: http://localhost:8545
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      hardhat:
        condition: service_healthy
    networks:
      - rental-network

networks:
  rental-network:
    driver: bridge
